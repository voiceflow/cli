  /v1/stable/document/url:
    post:
      operationId: StableDocumentController_createURL
      x-vf:
        mcp:
          tool: voiceflow_document
          toolDescription: |-
            Individual Knowledge Base documents. Four source types: text (plain prose), table (structured rows — each row becomes its own chunk), URL (web page or sitemap — system crawls), file (PDF/DOCX/TXT upload).
            The metadata model is documented on the table-creation operation — see it for how document-level metadata, searchable fields, non-searchable metadata fields, and chunk-level metadata interact, and which level the agent's Knowledge Base system tool filters on at runtime.
            Predecessor: select the project and environment first.
            Successor: query the knowledge base to verify retrieval surfaces the new/updated content with reasonable scores.
          operation: create_url
          operationDescription: |-
            WHAT — Add a web URL as a Knowledge Base source. System crawls the page (or follows the sitemap).
            USE WHEN — Content that lives on the customer's public site and stays in sync via scheduled refresh.
            DO NOT — Re-upload the same URL via create_url to refresh content — it makes a duplicate document. To refresh an existing URL document, use the source's refresh mechanism instead of re-creating.
        cli:
          command: document create-url
      x-speakeasy-group: document
      x-speakeasy-name-override: create-url
      summary: Create URL document
      description: Create a new document from a URL.
      parameters:
        - name: projectID
          required: true
          in: query
          schema:
            type: string
            description: The ID of the project to operate on.
        - name: environmentAlias
          required: true
          in: query
          schema:
            type: string
            description: The alias of the environment to operate on (e.g. `main`).
        - name: maxChunkSize
          required: false
          in: query
          schema:
            description: Determines how granularly each document is broken up. Range available is 500-1500 tokens, default is 1000. Smaller chunk size means narrower context, faster response, less tokens consumed, and greater risk of less accurate answers. Max chunk size affects the total amount of chunks parsed from a document - i.e., larger chunks means less chunks retrieved.
            anyOf:
              - type: string
              - type: number
        - name: overwrite
          required: false
          in: query
          schema:
            description: If set to true, the existing table with the same name will be overwritten.
            anyOf:
              - type: boolean
              - type: string
                enum:
                  - "true"
                  - "false"
                x-enumNames:
                  - "TRUE"
                  - "FALSE"
        - name: markdownConversion
          required: false
          in: query
          schema:
            description: When enabled, HTML is automatically converted to markdown to generate better chunks.
            anyOf:
              - type: boolean
              - type: string
                enum:
                  - "true"
                  - "false"
                x-enumNames:
                  - "TRUE"
                  - "FALSE"
        - name: llmBasedChunks
          required: false
          in: query
          schema:
            anyOf:
              - type: boolean
              - type: string
                enum:
                  - "true"
                  - "false"
                x-enumNames:
                  - "TRUE"
                  - "FALSE"
        - name: llmGeneratedQ
          required: false
          in: query
          schema:
            description: When enabled, an LLM will be used to generate a question based on the document context and specific chunk, then prepend it to the chunk. This enhances retrieval by aligning chunks with potential user queries.
            anyOf:
              - type: boolean
              - type: string
                enum:
                  - "true"
                  - "false"
                x-enumNames:
                  - "TRUE"
                  - "FALSE"
        - name: llmContentSummarization
          required: false
          in: query
          schema:
            description: When enabled, an LLM summarizes and rewrites the content, removing unnecessary information and focusing on important parts to optimize for retrieval. Limited to 15 rows per table upload.
            anyOf:
              - type: boolean
              - type: string
                enum:
                  - "true"
                  - "false"
                x-enumNames:
                  - "TRUE"
                  - "FALSE"
        - name: llmPrependContext
          required: false
          in: query
          schema:
            description: 'When enabled, an LLM generates a context summary based on the document and chunk context, and prepends it to each chunk. This improves retrieval by providing additional context to each chunk. Note: If both llmGeneratedQ and llmPrependContext are set to true, llmGeneratedQ takes precedence, and the context summarization will not be applied.'
            anyOf:
              - type: boolean
              - type: string
                enum:
                  - "true"
                  - "false"
                x-enumNames:
                  - "TRUE"
                  - "FALSE"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableDocumentCreateURLRequest'
      responses:
        "201":
          description: ""
          content:
