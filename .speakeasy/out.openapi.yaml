  /v1/stable/test:
    get:
      operationId: StableTestController_list
      x-vf:
        mcp:
          tool: voiceflow_test
          toolDescription: |-
            A saved, replayable conversation script for regression-testing an agent — build it once, rerun it after every change instead of manually re-checking the same scenario. A test is an ordered sequence of turns: user (a scripted message sent as-is), agent (asserts on how the agent responded, via one or more attached checks), or simulation (hands off to an LLM-driven persona conversation).
            Checks live on agent turns only and come in three flavors: response (judge the agent's reply text), routing (assert the agent did or didn't route to a specific playbook or workflow), tool (assert the agent did or didn't call a specific tool).
            Predecessor: select the project and environment first; build the playbooks, functions, and tools the test will exercise so there's real behavior to assert on.
            Successor: add turns, then checks on any agent turn, then trigger a run to see the checks pass or fail.
          operation: list
          operationDescription: |-
            WHAT — List all tests in the project.
            USE WHEN — Discovering what tests exist, or finding a testID to inspect or extend.
        cli:
          command: test list
      x-speakeasy-group: test
      x-speakeasy-name-override: list
      summary: List tests
      description: List all tests by project ID.
      parameters:
        - name: projectID
          required: true
          in: query
          schema:
            type: string
            description: The ID of the project to operate on.
        - name: environmentAlias
          required: true
          in: query
          schema:
            type: string
            description: The alias of the environment to operate on (e.g. `main`).
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableTestListResponse'
      tags:
        - Test
