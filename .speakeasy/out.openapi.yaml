            Instructions use XML structure: <context> (what the playbook is for and what state it assumes), <flow> (the step-by-step the LLM should follow), <rules> (hard constraints specific to this playbook), <edge_cases> (handling for known off-happy-path situations), <exit> (when to hand control back to the Main Agent or trigger an exit condition).
            Exit conditions only fire when the playbook is reached via a Workflow's Playbook canvas step — the workflow checks the condition and routes accordingly. When the playbook is reached via Agent routing (agentic), the Agent handles routing back via its own instructions and exit conditions are NOT consulted. Only design exit conditions for playbooks that will be embedded in Workflows.
            Invoked by the Main Agent (through its routing registry and instructions) or by a Playbook canvas step inside a Workflow.
            Predecessor: select the project and environment first; set the agent's global prompt so identity inherits cleanly.
            Successor: update the agent's routing so the playbook is reachable, attach any tools it needs, then run a test conversation.
          operation: update
          operationDescription: |-
            WHAT — Patch a playbook's fields. Partial PATCH — only fields you pass are changed; other fields stay put. This is how you edit the playbook's LLM description (the routing field), Instructions (XML behavior text), model override, and attached system tools.
