info:
  title: Realtime
  description: Realtime gateway API service
  version: 1.0.0
  contact: {}
tags: []
servers:
  - url: https://realtime-api.voiceflow.com
components:
  securitySchemes:
    auth:
      type: apiKey
      in: header
      name: authorization
      description: Voiceflow API key
    token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Voiceflow bearer token
  schemas:
    AnyTrace:
      oneOf:
        - $ref: '#/components/schemas/AudioTrace'
        - $ref: '#/components/schemas/SpeakTrace'
        - $ref: '#/components/schemas/StreamTrace'
        - $ref: '#/components/schemas/BlockTrace'
        - $ref: '#/components/schemas/CardTrace'
        - $ref: '#/components/schemas/CarouselTrace'
        - $ref: '#/components/schemas/ChannelActionTrace'
        - $ref: '#/components/schemas/ChoiceTrace'
        - $ref: '#/components/schemas/CompletionTrace'
        - $ref: '#/components/schemas/DebugTrace'
        - $ref: '#/components/schemas/DTMFTrace'
        - $ref: '#/components/schemas/EntityFillingTrace'
        - $ref: '#/components/schemas/ExitTrace'
        - $ref: '#/components/schemas/FlowTrace'
        - $ref: '#/components/schemas/GoToTrace'
        - $ref: '#/components/schemas/LogTrace'
        - $ref: '#/components/schemas/NoReplyTrace'
        - $ref: '#/components/schemas/PathTrace'
        - $ref: '#/components/schemas/TextTrace'
        - $ref: '#/components/schemas/ReasoningTrace'
        - $ref: '#/components/schemas/VisualTrace'
        - $ref: '#/components/schemas/KnowledgeBaseTrace'
        - $ref: '#/components/schemas/CallForwardTrace'
        - $ref: '#/components/schemas/RealtimeAgentTrace'
        - $ref: '#/components/schemas/LiveAgentHandoffTrace'
        - $ref: '#/components/schemas/ToolCallTrace'
    AudioTrace:
      type: object
      properties:
        type:
          type: string
          enum:
            - audio
          x-enumNames:
            - AUDIO
        paths:
          type: array
          items:
            $ref: '#/components/schemas/TracePath'
        defaultPath:
          type: number
        time:
          type: number
        turnID:
          type: string
        handleID:
          type: string
        payload:
          anyOf:
            - type: object
              properties:
                state:
                  type: string
                  enum:
                    - start
                  x-enumNames:
                    - START
                messageID:
                  type: string
                delay:
                  type: number
              required:
                - state
                - messageID
            - type: object
              properties:
                state:
                  type: string
                  enum:
                    - content
                  x-enumNames:
                    - CONTENT
                content:
                  type: string
                encoding:
                  $ref: '#/components/schemas/AudioEncoding'
                duration:
                  type: number
              required:
                - state
                - content
                - encoding
            - type: object
              properties:
                state:
                  type: string
                  enum:
                    - end
                  x-enumNames:
                    - END
              required:
                - state
      required:
        - type
        - payload
    TracePath:
      type: object
      properties:
        label:
          type: string
        event:
          allOf:
            - $ref: '#/components/schemas/BaseRequest'
    BaseRequest:
      type: object
      properties:
        type:
          type: string
        payload: {}
        diagramID:
          type: string
        time:
          type: number
        metadata:
          type: object
          additionalProperties: {}
      required:
        - type
    AudioEncoding:
      type: string
      enum:
        - audio/mp3
        - audio/x-mulaw
        - audio/pcm
      x-enumNames:
        - MP_3
        - MULAW
        - PCM
    SpeakTrace:
      type: object
      properties:
        type:
          type: string
          enum:
            - speak
          x-enumNames:
            - SPEAK
        paths:
          type: array
          items:
            $ref: '#/components/schemas/TracePath'
        defaultPath:
          type: number
        time:
          type: number
        turnID:
          type: string
        handleID:
          type: string
        payload:
          type: object
          properties:
            ai:
              type: boolean
            message:
              type: string
            type:
              $ref: '#/components/schemas/TraceSpeakType'
