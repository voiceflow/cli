  /v1/stable/playbook:
    get:
      operationId: StablePlaybookController_list
      x-vf:
        mcp:
          tool: voiceflow_playbook
          toolDescription: |-
            A specialized LLM-driven sub-agent that handles multi-step flows. Each playbook has an LLM description (drives routing), Instructions (drives behavior), an optional model override, attached tools, and optional exit conditions. Playbooks inherit the Global Prompt for identity/tone — their Instructions carry domain-specific behavior only.
            The LLM-facing description is what the Agent reads when deciding whether to route to this playbook. Write it in WHAT/WHEN format — WHAT the playbook does AND WHEN the Agent (or a specific playbook) should route into it. Example: "Schedules a new appointment. Route here when the caller says 'book', 'schedule', 'come out', or describes an appliance problem they want service for."
            Instructions use XML structure: <context> (what the playbook is for and what state it assumes), <flow> (the step-by-step the LLM should follow), <rules> (hard constraints specific to this playbook), <edge_cases> (handling for known off-happy-path situations), <exit> (when to hand control back to the Main Agent or trigger an exit condition).
            Exit conditions only fire when the playbook is reached via a Workflow's Playbook canvas step — the workflow checks the condition and routes accordingly. When the playbook is reached via Agent routing (agentic), the Agent handles routing back via its own instructions and exit conditions are NOT consulted. Only design exit conditions for playbooks that will be embedded in Workflows.
            Invoked by the Main Agent (through its routing registry and instructions) or by a Playbook canvas step inside a Workflow.
            Predecessor: select the project and environment first; set the agent's global prompt so identity inherits cleanly.
            Successor: update the agent's routing so the playbook is reachable, attach any tools it needs, then run a test conversation.
          operation: list
          operationDescription: |-
            WHAT — List all playbooks in the project.
            USE WHEN — Discovering what playbooks exist, or finding a playbookID to edit.
        cli:
          command: playbook list
      x-speakeasy-group: playbook
      x-speakeasy-name-override: list
      summary: List playbooks
      description: List all playbooks by project ID.
      parameters:
