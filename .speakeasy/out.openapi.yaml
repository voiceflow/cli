  /v1/stable/agent:
    get:
      operationId: StableAgentController_get
      x-vf:
        mcp:
          tool: voiceflow_agent
          toolDescription: |-
            The Main Agent — the project-level configuration every conversation runs through. One Agent per Project, read and written as a single object spanning five layers:
            Global Prompt — markdown prepended to every LLM call the agent makes: Agent routing, every Playbook, every Operator step inside Workflows. It's the top of the prompt stack: identity, tone, formatting rules, guardrails. Outer structure is four markdown sections Voiceflow scaffolds — # Role, # Goal, # Tone, # Guardrails — with XML tags inside for the LLM to attend to: <identity>, <goal>, <tone>, <formatting> for persona; <terminology>, <escalation>, <silent_execution>, <data_handling> for guidelines. The <tone> block MUST carry WRONG/RIGHT examples; abstract tone descriptions don't constrain output. Total length 100-1000 words. An opt-in flag appends Voiceflow's default prompting guidelines.
            Instructions — XML-structured routing logic telling the LLM how to choose among the registered playbooks and workflows. Required sections: <routing> (overall strategy), <routing_table> (per-target decision rules), <clarification> (how to ask follow-ups when intent is ambiguous), <rules> (hard constraints like "never re-greet"). Strictly routing logic — persona lives in the global prompt, domain content lives in Playbook Instructions.
            Routing registry — the structured list of targets the Main Agent can route to, each with its own routing description. The registry controls WHICH targets are reachable; the instructions control WHEN each is picked — a target registered without a matching <routing_table> entry is reachable but never chosen.
            Behavior — project-wide defaults affecting every LLM call: default model + temperature + max tokens, priority processing, outage protection (per-provider fallback models). For phone-call projects, this layer also covers TTS (provider/voice/synthesis/tuning/pronunciation dictionary) and STT (provider/model/language/keypad input).
            System tools — Knowledge Base, web search, buttons, cards, carousels, skip turn, call forward, and end — first-party platform behaviors, distinct from Functions/APIs (user-defined code/HTTP) and Integrations (third-party services). Enabled here, they're inherited by every playbook, which may customize the description but cannot disable; per-playbook overrides live on the playbook itself. Each carries a configurable LLM-routing description — write it in WHAT/WHEN format (WHAT the tool does AND WHEN to pick it). Defaults are reasonable but often too generic (e.g. "Use this when you have something to say" vs. "Use to render a list of available time slots as tappable buttons"). A separate ordering controls the sequence of the agent's exit paths.
            Modifications take effect only after the environment is recompiled.
            Predecessor: select the project and environment first, and check the Project type — some voice fields are phone-call only; create a playbook before wiring it into the routing registry.
            Successor: create playbooks for task-specific instructions (those don't belong in prompt), recompile the environment, then run a test conversation to verify identity/tone come through and routing picks the right target on representative utterances. For voice projects, listen to the actual audio output, not just the text trace.
          operation: get
          operationDescription: |-
            WHAT — Read the full agent configuration in one call.
            USE WHEN — Before editing any part of the agent (merge target for update), auditing the agent's full capability surface, or diagnosing an identity, tone, routing, or tool problem that could originate in any of these layers.
            DO NOT — Assume an empty prompt or instructions field means "never set" — on a freshly imported .vf agent these may not have materialized yet. Treat empty as unset and proceed with update.
        cli:
          command: agent get
      x-speakeasy-group: agent
      x-speakeasy-name-override: get
      summary: Get agent
      description: Get agent configuration.
      parameters:
        - name: projectID
          required: true
          in: query
          schema:
            type: string
            description: The ID of the project to operate on.
        - name: environmentAlias
          required: true
          in: query
          schema:
            type: string
            description: The alias of the environment to operate on (e.g. `main`).
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableAgentResponse'
      tags:
        - Agent
      security:
        - token: []
