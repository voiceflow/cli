            - reason
            - createdAt
            - updatedAt
        - oneOf:
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - boolean
                  description: Discriminator indicating the evaluation produces a boolean result.
                  x-enumNames:
                    - BOOLEAN
              required:
                - type
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - number
                  description: Discriminator indicating the evaluation produces a numeric result.
                  x-enumNames:
                    - NUMBER
