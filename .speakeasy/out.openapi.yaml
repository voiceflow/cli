openapi: 3.0.0
paths:
  /v1/stable/workspace:
    get:
      operationId: StableWorkspaceController_list
      x-vf:
        mcp:
          tool: voiceflow_workspace
          toolDescription: |-
            Manage Voiceflow Workspaces — the top-level container for Projects and team members. Every Project belongs to exactly one Workspace. Subscription plan determines how many Workspaces an account can have.
            Predecessor: none — Workspace is the root; start here when orienting in a fresh session.
            Successor: list the Projects in the Workspace, or create a new one.
          operation: list
          operationDescription: |-
            WHAT — List all Workspaces the authenticated user belongs to.
            USE WHEN — Starting a new session and you don't yet know which Workspace the user wants to work in, or enumerating Workspaces for selection.
            AFTER — voiceflow_project.list once you have the target workspaceID.
        cli:
          command: workspace list
      x-speakeasy-group: workspace
      x-speakeasy-name-override: list
      summary: List workspaces
      description: List all workspaces the authorized account is a member of.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableWorkspaceListResponse'
      tags:
        - Workspace
      security:
        - token: []
    post:
      operationId: StableWorkspaceController_create
      x-vf:
        mcp:
          tool: voiceflow_workspace
          toolDescription: |-
            Manage Voiceflow Workspaces — the top-level container for Projects and team members. Every Project belongs to exactly one Workspace. Subscription plan determines how many Workspaces an account can have.
            Predecessor: none — Workspace is the root; start here when orienting in a fresh session.
            Successor: list the Projects in the Workspace, or create a new one.
          operation: create
          operationDescription: |-
            WHAT — Create a new Workspace.
            USE WHEN — User explicitly asks to create a new Workspace. Subscription plan limits how many Workspaces an account can have.
            BEFORE — voiceflow_workspace.list to confirm the user isn't accidentally duplicating an existing Workspace.
            AFTER — voiceflow_project.create to add the first Project to the new Workspace.
            DO NOT — Create a Workspace without explicit user intent — most users work within a single existing Workspace.
        cli:
          command: workspace create
      x-speakeasy-group: workspace
      x-speakeasy-name-override: create
      summary: Create workspace
      description: Create a new workspace.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableWorkspaceCreateRequest'
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableWorkspaceResponse'
      tags:
        - Workspace
      security:
        - token: []
  /v1/stable/workspace/{workspaceID}:
    get:
      operationId: StableWorkspaceController_get
      x-vf:
        mcp:
          tool: voiceflow_workspace
          toolDescription: |-
            Manage Voiceflow Workspaces — the top-level container for Projects and team members. Every Project belongs to exactly one Workspace. Subscription plan determines how many Workspaces an account can have.
            Predecessor: none — Workspace is the root; start here when orienting in a fresh session.
            Successor: list the Projects in the Workspace, or create a new one.
          operation: get
          operationDescription: |-
            WHAT — Fetch a single Workspace by ID.
            USE WHEN — Confirming a Workspace exists before creating a Project in it, or retrieving current metadata before an update.
            AFTER — voiceflow_project.list or voiceflow_project.create.
        cli:
          command: workspace get
      x-speakeasy-group: workspace
      x-speakeasy-name-override: get
      summary: Get workspace
      description: Get a single workspace by ID.
      parameters:
        - name: workspaceID
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableWorkspaceResponse'
      tags:
        - Workspace
      security:
        - token: []
    patch:
      operationId: StableWorkspaceController_update
      x-vf:
        mcp:
          tool: voiceflow_workspace
          toolDescription: |-
            Manage Voiceflow Workspaces — the top-level container for Projects and team members. Every Project belongs to exactly one Workspace. Subscription plan determines how many Workspaces an account can have.
            Predecessor: none — Workspace is the root; start here when orienting in a fresh session.
            Successor: list the Projects in the Workspace, or create a new one.
          operation: update
          operationDescription: |-
            WHAT — Rename a Workspace.
            USE WHEN — User wants to rename their Workspace.
            BEFORE — voiceflow_workspace.get to see current name.
            DO NOT — Use this to manage Projects, members, or roles — those are managed outside the MCP tools.
        cli:
          command: workspace update
      x-speakeasy-group: workspace
      x-speakeasy-name-override: update
      summary: Update workspace
      description: Update a single workspace by ID.
      parameters:
        - name: workspaceID
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/StableWorkspaceUpdateRequest'
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableUpdateResponse'
      tags:
        - Workspace
      security:
        - token: []
    delete:
      operationId: StableWorkspaceController_delete
      x-vf:
        mcp:
          tool: voiceflow_workspace
          toolDescription: |-
            Manage Voiceflow Workspaces — the top-level container for Projects and team members. Every Project belongs to exactly one Workspace. Subscription plan determines how many Workspaces an account can have.
            Predecessor: none — Workspace is the root; start here when orienting in a fresh session.
            Successor: list the Projects in the Workspace, or create a new one.
          operation: delete
          operationDescription: |-
            WHAT — Remove a workspace.
            DO NOT — Delete without explicit user confirmation — all projects and their content inside the workspace are permanently lost with no undo.
        cli:
          command: workspace delete
      x-speakeasy-group: workspace
      x-speakeasy-name-override: delete
      summary: Delete workspace
      description: Delete a single workspace by ID.
      parameters:
        - name: workspaceID
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableDeleteResponse'
      tags:
        - Workspace
      security:
        - token: []
  /v1/stable/project:
    get:
      operationId: StableProjectController_list
      x-vf:
        mcp:
          tool: voiceflow_project
          toolDescription: |-
            Create, list, and manage Voiceflow Projects — the dashboard-level container. Every Project owns its Playbooks, Workflows, Tools, Variables, and Knowledge Base, and lives inside a Workspace.
            Predecessor: select the workspace first.
            Successor: set the agent's global prompt (Role/Goal/Tone/Guardrails), then add task-scoped Playbooks.
          operation: list
          operationDescription: |-
            WHAT — Lists all Projects in a Workspace.
            USE WHEN — User says "work on my X project," you need to pick a Project from a Workspace, or orienting yourself in a fresh session.
            BEFORE — voiceflow_workspace.list if you don't yet have a workspaceID.
            AFTER — voiceflow_project.get to load full detail on the one the user picked.
        cli:
          command: project list
      x-speakeasy-group: project
      x-speakeasy-name-override: list
      summary: List projects
      description: List all projects by workspace ID.
      parameters:
        - name: workspaceID
          required: true
          in: query
          schema:
            type: string
            description: The ID of the workspace to list projects from.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableProjectListResponse'
      tags:
        - Project
      security:
        - token: []
    post:
      operationId: StableProjectController_create
      x-vf:
        mcp:
          tool: voiceflow_project
          toolDescription: |-
            Create, list, and manage Voiceflow Projects — the dashboard-level container. Every Project owns its Playbooks, Workflows, Tools, Variables, and Knowledge Base, and lives inside a Workspace.
            Predecessor: select the workspace first.
            Successor: set the agent's global prompt (Role/Goal/Tone/Guardrails), then add task-scoped Playbooks.
          operation: create
          operationDescription: |-
            WHAT — Creates a new Project.
            USE WHEN — User asks to build a new agent from scratch.
            BEFORE — voiceflow_workspace.list if you don't yet have a workspaceID; voiceflow_project.list to make sure the user isn't accidentally duplicating an existing Project.
            AFTER — voiceflow_playbook.create (add task Playbooks), then voiceflow_agent.update (set identity and make playbooks reachable).
        cli:
          command: project create
      x-speakeasy-group: project
      x-speakeasy-name-override: create
      summary: Create project
      description: Create a new project.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableProjectCreateRequest'
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableProjectResponse'
      tags:
        - Project
      security:
        - token: []
  /v1/stable/project/{projectID}:
    get:
      operationId: StableProjectController_get
      x-vf:
        mcp:
          tool: voiceflow_project
          toolDescription: |-
            Create, list, and manage Voiceflow Projects — the dashboard-level container. Every Project owns its Playbooks, Workflows, Tools, Variables, and Knowledge Base, and lives inside a Workspace.
            Predecessor: select the workspace first.
            Successor: set the agent's global prompt (Role/Goal/Tone/Guardrails), then add task-scoped Playbooks.
          operation: get
          operationDescription: |-
            WHAT — Fetches one Project by ID.
            USE WHEN — Confirming a Project exists before editing.
            BEFORE — voiceflow_workspace.list → voiceflow_project.list if you don't yet have the projectID.
            AFTER — Most other tools need projectID + environmentAlias; some downstream calls may also require playbookID.
        cli:
          command: project get
      x-speakeasy-group: project
      x-speakeasy-name-override: get
      summary: Get project
      description: Get a project by ID.
      parameters:
        - name: projectID
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableProjectResponse'
      tags:
        - Project
      security:
        - token: []
    patch:
      operationId: StableProjectController_update
      x-vf:
        mcp:
          tool: voiceflow_project
          toolDescription: |-
            Create, list, and manage Voiceflow Projects — the dashboard-level container. Every Project owns its Playbooks, Workflows, Tools, Variables, and Knowledge Base, and lives inside a Workspace.
            Predecessor: select the workspace first.
            Successor: set the agent's global prompt (Role/Goal/Tone/Guardrails), then add task-scoped Playbooks.
          operation: update
          operationDescription: |-
            WHAT — Updates top-level Project metadata.
            USE WHEN — Renaming a Project or updating org-level metadata.
            BEFORE — voiceflow_project.get to see current metadata.
            DO NOT — Use this to edit Playbook content, behavior, or the Global Prompt. Those have their own tools — voiceflow_playbook.update, voiceflow_agent.update.
        cli:
          command: project update
      x-speakeasy-group: project
      x-speakeasy-name-override: update
      summary: Update project
      description: Update a project by ID.
      parameters:
        - name: projectID
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/StableProjectUpdateRequest'
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableUpdateResponse'
      tags:
        - Project
      security:
        - token: []
    delete:
      operationId: StableProjectController_delete
      x-vf:
        mcp:
          tool: voiceflow_project
          toolDescription: |-
            Create, list, and manage Voiceflow Projects — the dashboard-level container. Every Project owns its Playbooks, Workflows, Tools, Variables, and Knowledge Base, and lives inside a Workspace.
            Predecessor: select the workspace first.
            Successor: set the agent's global prompt (Role/Goal/Tone/Guardrails), then add task-scoped Playbooks.
          operation: delete
          operationDescription: |-
            WHAT — Remove a project.
            DO NOT — Delete without explicit user confirmation — cascades to all environments, versions, and knowledge base content with no undo.
        cli:
          command: project delete
      x-speakeasy-group: project
      x-speakeasy-name-override: delete
      summary: Delete project
      description: Delete a project by ID.
      parameters:
        - name: projectID
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableDeleteResponse'
      tags:
        - Project
      security:
        - token: []
  /v1/stable/environment:
    get:
      operationId: StableEnvironmentController_list
      x-vf:
        mcp:
          tool: voiceflow_environment
          toolDescription: |-
            Manage the versioned copies of a Project — every Project starts with one Main environment and can have up to nine more, each with its own draft + live version. Environments are how Voiceflow ships changes: publish promotes a draft to live within one environment, merge promotes one environment into Main, and traffic-split routes live traffic across them.
            Predecessor: select the project first.
            Successor: run a test conversation after a clone, or publish to ship the draft.
          operation: list
          operationDescription: |-
            WHAT — List every environment on a Project.
            USE WHEN — Orienting yourself on a Project for the first time, before deciding which environment to edit or test against.
            AFTER — voiceflow_environment.get to load full detail on the one you want to work in.
        cli:
          command: environment list
      x-speakeasy-group: environment
      x-speakeasy-name-override: list
      summary: List environments
      description: List all environments by project ID.
      parameters:
        - name: projectID
          required: true
          in: query
          schema:
            type: string
            description: The ID of the project to operate on.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableEnvironmentListResponse'
      tags:
        - Environment
      security:
        - token: []
  /v1/stable/environment/merge:
    put:
      operationId: StableEnvironmentController_merge
      x-vf:
        mcp:
          tool: voiceflow_environment
          toolDescription: |-
            Manage the versioned copies of a Project — every Project starts with one Main environment and can have up to nine more, each with its own draft + live version. Environments are how Voiceflow ships changes: publish promotes a draft to live within one environment, merge promotes one environment into Main, and traffic-split routes live traffic across them.
            Predecessor: select the project first.
            Successor: run a test conversation after a clone, or publish to ship the draft.
          operation: merge
          operationDescription: |-
            WHAT — Replace Main's live version entirely with another environment's live version. Recorded in Main's version history; the previous Main is preserved and revertable.
            USE WHEN — A non-Main environment has been validated and you want to roll its changes into Main for all traffic.
            BEFORE — voiceflow_environment.publish on the source environment so its live version reflects current draft state.
            DO NOT — Merge if Main has live changes since you cloned the source — you'll lose them. Clone a fresh env from Main, port changes to it, then merge.
        cli:
          command: environment merge
      x-speakeasy-group: environment
      x-speakeasy-name-override: merge
      summary: Merge environments
      description: Merge one environment into another.
      parameters:
        - name: projectID
          required: true
          in: query
          schema:
            type: string
            description: The ID of the project to operate on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableEnvironmentMergeRequest'
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableEnvironmentMergeResponse'
      tags:
        - Environment
      security:
        - token: []
  /v1/stable/environment/update-traffic-split:
    put:
      operationId: StableEnvironmentController_updateTrafficSplit
      x-vf:
        mcp:
          tool: voiceflow_environment
          toolDescription: |-
            Manage the versioned copies of a Project — every Project starts with one Main environment and can have up to nine more, each with its own draft + live version. Environments are how Voiceflow ships changes: publish promotes a draft to live within one environment, merge promotes one environment into Main, and traffic-split routes live traffic across them.
            Predecessor: select the project first.
            Successor: run a test conversation after a clone, or publish to ship the draft.
          operation: update_traffic_split
          operationDescription: |-
            WHAT — Configure what percentage of live traffic goes to each environment. Values must sum to 100. No body returned.
            USE WHEN — Rolling out a new environment gradually, A/B testing two agent versions, or shifting traffic during a deploy.
            DO NOT — Set 100% on a non-Main environment without explicit user intent. Traffic split is sticky per user across sessions, so flipping it mid-deploy changes who sees what.
        cli:
          command: environment update-traffic-split
      x-speakeasy-group: environment
      x-speakeasy-name-override: update-traffic-split
      summary: Update traffic split
      description: Update the percentage of traffic routed to each environment.
      parameters:
        - name: projectID
          required: true
          in: query
          schema:
            type: string
            description: The ID of the project to operate on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableEnvironmentUpdateTrafficSplitRequest'
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableUpdateResponse'
      tags:
        - Environment
      security:
        - token: []
  /v1/stable/environment/{environmentAlias}:
    get:
      operationId: StableEnvironmentController_get
      x-vf:
        mcp:
          tool: voiceflow_environment
          toolDescription: |-
            Manage the versioned copies of a Project — every Project starts with one Main environment and can have up to nine more, each with its own draft + live version. Environments are how Voiceflow ships changes: publish promotes a draft to live within one environment, merge promotes one environment into Main, and traffic-split routes live traffic across them.
            Predecessor: select the project first.
            Successor: run a test conversation after a clone, or publish to ship the draft.
          operation: get
          operationDescription: |-
            WHAT — Fetch a single environment by ID.
            USE WHEN — You need to confirm an environment's current live version, check its alias, or inspect its draft before publishing.
        cli:
          command: environment get
      x-speakeasy-group: environment
      x-speakeasy-name-override: get
      summary: Get environment
      description: Get an environment by alias or ID.
      parameters:
        - name: environmentAlias
          required: true
          in: path
          schema:
            type: string
        - name: projectID
          required: true
          in: query
          schema:
            type: string
            description: The ID of the project to operate on.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableEnvironmentResponse'
      tags:
        - Environment
      security:
        - token: []
    patch:
      operationId: StableEnvironmentController_update
      x-vf:
        mcp:
          tool: voiceflow_environment
          toolDescription: |-
            Manage the versioned copies of a Project — every Project starts with one Main environment and can have up to nine more, each with its own draft + live version. Environments are how Voiceflow ships changes: publish promotes a draft to live within one environment, merge promotes one environment into Main, and traffic-split routes live traffic across them.
            Predecessor: select the project first.
            Successor: run a test conversation after a clone, or publish to ship the draft.
          operation: update
          operationDescription: |-
            WHAT — Rename an environment.
            USE WHEN — Cleaning up environment names after cloning, or rebranding an environment (e.g. "experimental" → "staging").
        cli:
          command: environment update
      x-speakeasy-group: environment
      x-speakeasy-name-override: update
      summary: Update environment
      description: Update a environment by alias or ID.
      parameters:
        - name: environmentAlias
          required: true
          in: path
          schema:
            type: string
        - name: projectID
          required: true
          in: query
          schema:
            type: string
            description: The ID of the project to operate on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/StableEnvironmentUpdateRequest'
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableUpdateResponse'
      tags:
        - Environment
      security:
        - token: []
    delete:
      operationId: StableEnvironmentController_delete
      x-vf:
        mcp:
          tool: voiceflow_environment
          toolDescription: |-
            Manage the versioned copies of a Project — every Project starts with one Main environment and can have up to nine more, each with its own draft + live version. Environments are how Voiceflow ships changes: publish promotes a draft to live within one environment, merge promotes one environment into Main, and traffic-split routes live traffic across them.
            Predecessor: select the project first.
            Successor: run a test conversation after a clone, or publish to ship the draft.
          operation: delete
          operationDescription: |-
            WHAT — Remove an environment. Rejected for the main environment or the last environment on a project.
            BEFORE — voiceflow_environment.update_traffic_split to route any live traffic away first.
            DO NOT — Delete an environment that's still receiving live traffic.
        cli:
          command: environment delete
      x-speakeasy-group: environment
      x-speakeasy-name-override: delete
      summary: Delete environment
      description: Delete an environment by alias or ID.
      parameters:
        - name: environmentAlias
          required: true
          in: path
          schema:
            type: string
        - name: projectID
          required: true
          in: query
          schema:
            type: string
            description: The ID of the project to operate on.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableDeleteResponse'
      tags:
        - Environment
      security:
        - token: []
  /v1/stable/environment/{environmentAlias}/compile:
    put:
      operationId: StableEnvironmentController_compile
      x-vf:
        mcp:
          tool: voiceflow_environment
          toolDescription: |-
            Manage the versioned copies of a Project — every Project starts with one Main environment and can have up to nine more, each with its own draft + live version. Environments are how Voiceflow ships changes: publish promotes a draft to live within one environment, merge promotes one environment into Main, and traffic-split routes live traffic across them.
            Predecessor: select the project first.
            Successor: run a test conversation after a clone, or publish to ship the draft.
          operation: compile
          operationDescription: |-
            WHAT — Compile the environment's draft so recent edits take effect when testing.
            USE WHEN — After any non-trivial edit (Function creation, tool attachment, agent_routing change, prompt update) and before a test conversation against this environment.
            AFTER — voiceflow_conversation.send once compile completes.
            DO NOT — Skip compile after edits. Without it, the test conversation runs against the last-compiled version and changes won't be reflected — easy to spend 20 minutes "debugging" a fix that never took effect.
        cli:
          command: environment compile
      x-speakeasy-group: environment
      x-speakeasy-name-override: compile
      summary: Compile environment
      description: Compile an environment.
      parameters:
        - name: environmentAlias
          required: true
          in: path
          schema:
            type: string
        - name: projectID
          required: true
          in: query
          schema:
            type: string
            description: The ID of the project to operate on.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableEnvironmentCompileResponse'
      tags:
        - Environment
      security:
        - token: []
  /v1/stable/environment/{environmentAlias}/clone:
    post:
      operationId: StableEnvironmentController_clone
      x-vf:
        mcp:
          tool: voiceflow_environment
          toolDescription: |-
            Manage the versioned copies of a Project — every Project starts with one Main environment and can have up to nine more, each with its own draft + live version. Environments are how Voiceflow ships changes: publish promotes a draft to live within one environment, merge promotes one environment into Main, and traffic-split routes live traffic across them.
            Predecessor: select the project first.
            Successor: run a test conversation after a clone, or publish to ship the draft.
          operation: clone
          operationDescription: |-
            WHAT — Create a new environment by cloning an existing one (typically Main).
            USE WHEN — User wants a staging environment, A/B test branch, or a sandbox to try changes without touching live traffic.
            AFTER — voiceflow_environment.update_traffic_split if you want to send some live traffic to the new environment.
            DO NOT — Clone Main when Main has unpublished draft changes you don't want carried over. Publish Main first or work off the live version.
        cli:
          command: environment clone
      x-speakeasy-group: environment
      x-speakeasy-name-override: clone
      summary: Clone environment
      description: Clone an environment.
      parameters:
        - name: environmentAlias
          required: true
          in: path
          schema:
            type: string
        - name: projectID
          required: true
          in: query
          schema:
            type: string
            description: The ID of the project to operate on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableEnvironmentCloneRequest'
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableEnvironmentResponse'
      tags:
        - Environment
      security:
        - token: []
  /v1/stable/environment/{environmentAlias}/publish:
    post:
      operationId: StableEnvironmentController_publish
      x-vf:
        mcp:
          tool: voiceflow_environment
          toolDescription: |-
