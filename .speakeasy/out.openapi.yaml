            The function's description is LLM-facing — the LLM reads it when deciding whether to call the function. Write it in WHAT/WHEN format: WHAT the function does AND WHEN the LLM should call it. A pure WHAT ("Looks up postal code") routes badly; the WHEN ("Use when the user provides a postal code or asks to verify service availability for their address") is what gives the LLM the signal to pick correctly.
            Predecessor: select the project and environment first; create any project variables the function reads or writes.
            Successor: attach the function at agent level, recompile the environment, then run a test conversation to verify the function's declared outputs actually populate.
          operation: create
          operationDescription: |-
            WHAT — Create a new function.
            Code body shape (example):
              export default async function main(args) {
                const { postalCode, apiKey } = args.inputVars;
                try {
                  const response = await fetch("https://api.example.com/serviceable", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${apiKey}` },
                    body: JSON.stringify({ postalCode })
                  });
                  const data = response.json;  // NOTE: property, not method
                  return {
                    outputVars: {
                      is_serviceable: data.serviceable,
                      service_zones: data.zones.join(",")  // arrays must be stringified
                    },
                    next: { path: data.serviceable ? "success" : "out_of_area" }
                  };
                } catch (err) {
                  return { outputVars: { is_serviceable: false }, next: { path: "error" } };
                }
              }
            USE WHEN — User needs custom logic the agent can call: transforms, parsing, computation, chained API calls, conditional branching on a response.
            AFTER — voiceflow_tool.create (target=global,type=function) to attach at agent level, then voiceflow_environment.compile.
            DO NOT — Write the description as pure WHAT (just what the function does). The LLM uses this text to decide whether to call the function — it must include WHEN (the user signals or data conditions that should trigger the call). Also: don't hardcode auth keys in function code — declare them as input variables (filled at call time by the LLM or auto-filled from a project variable). And: outputVars only accepts string/number/boolean — null, undefined, objects, arrays all fail silently. Stringify objects if you need structured outputs.
        cli:
          command: function create
      x-speakeasy-group: function
      x-speakeasy-name-override: create
      summary: Create function
      description: Create a new function.
      parameters:
        - name: projectID
          required: true
          in: query
          schema:
            type: string
            description: The ID of the project to operate on.
