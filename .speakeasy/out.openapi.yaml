              nullable: true
              type: string
            voice:
              type: string
            isPrompt:
              type: boolean
          required:
            - message
            - type
      required:
        - type
        - payload
    TraceSpeakType:
      type: string
      enum:
        - audio
        - message
      x-enumNames:
        - AUDIO
        - MESSAGE
    StreamTrace:
      type: object
      properties:
        type:
