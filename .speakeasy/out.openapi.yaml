            Exit conditions only fire when the playbook is reached via a Workflow's Playbook canvas step — the workflow checks the condition and routes accordingly. When the playbook is reached via Agent routing (agentic), the Agent handles routing back via its own instructions and exit conditions are NOT consulted. Only design exit conditions for playbooks that will be embedded in Workflows.
            Invoked by the Main Agent (through its routing registry and instructions) or by a Playbook canvas step inside a Workflow.
            Predecessor: select the project and environment first; set the agent's global prompt so identity inherits cleanly.
            Successor: update the agent's routing so the playbook is reachable, attach any tools it needs, then run a test conversation.
          operation: create
          operationDescription: |-
            WHAT — Create a new playbook with name, LLM description (drives routing — must be in WHAT/WHEN format), instructions (XML-structured behavior text), and optionally settings + attached system tools.
            Instructions body shape (XML). The structure is fixed; content is playbook-specific:
              <context>...</context>            — what this playbook handles, project vars it expects to be set on entry, assumed state at routing-in
              <input_variables>...</input_variables> — list of project variables the playbook references (e.g. `- {customer_name}: caller's name if collected`). Any variable listed here can be referenced inline elsewhere in the prompt via {variable_name} syntax — the runtime substitutes the actual value. Built-in variables like {user_id}, {last_utterance}, {vf_now} can be referenced without declaring them. Unset variables resolve to the literal 0 (number), not empty string — guard branches in <flow> or <edge_cases> against that.
              <flow>...</flow>                  — the step-by-step the LLM follows (numbered list, one action per step)
              <rules>...</rules>                — hard constraints specific to this playbook (one question per turn, never invent values, etc.)
              <edge_cases>...</edge_cases>      — handling for known off-happy-path situations (empty results, mid-flow cancellation, missing required state)
              <exit>...</exit>                  — when to hand control back to the Main Agent or trigger an exit condition
            USE WHEN — User wants to add a new multi-step task the agent can handle (booking, escalation, FAQ + tool use).
            AFTER — voiceflow_agent.update (make it reachable), voiceflow_tool.create (give it capabilities), then voiceflow_conversation.
