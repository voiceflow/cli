        timeoutInSeconds:
          type: number
          minimum: 0
          maximum: 10
          description: How long to wait before processing the DTMF input. Set to 0 to process only after a delimiter is provided.
        delimiter:
          type: array
          items:
            $ref: '#/components/schemas/DTMFDelimiter'
          description: Which key to use to end DTMF input. Defaults to '#'
        maxDigits:
          type: number
          minimum: 1
          maximum: 20
          description: The maximum number of digits before we finish their input
      required:
