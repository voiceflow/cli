          toolDescription: |-
            Drive a live test session against the agent runtime, turn by turn. You send actions (launch, text, intent, event) and the runtime returns trace arrays you inspect (text, speak, cardV2, choice, end, debug). The most common build-loop smoke test — verify a change actually works before publishing.
            Predecessor: select the project and environment first, and recompile the environment after any edits (otherwise the test runs against the last-compiled version and changes won't be reflected).
            Successor: search transcripts to find the resulting one for deeper inspection, or head back to the build surfaces to apply a fix.
          operation: send
          operationDescription: |-
            WHAT — Send a turn input to the runtime. Action types: text (most common), intent (test a specific intent branch), event (extension-emitted), launch (start).
            USE WHEN — Driving a multi-turn conversation, simulating a user message.
            AFTER — Inspect the returned trace array carefully: right trace type for the channel (text on chat, speak/audio on voice); tool called when expected and with the right args; error paths handled; no information leakage ("I checked the knowledge base..."); no re-greeting; variables not showing as literal "0" because they weren't pre-resolved.
            DO NOT — Conclude success based on the visible agent reply alone. The reply often looks fine while a tool silently failed or returned empty — you'll only catch it by reading the trace.
        cli:
          command: conversation send
      x-speakeasy-group: conversation
      x-speakeasy-name-override: send
      summary: Send
      description: Send message to a conversation.
      parameters:
        - name: userID
          required: true
          in: path
          schema:
            type: string
        - name: projectID
          required: true
          in: query
          schema:
            type: string
            description: The ID of the project to operate on.
