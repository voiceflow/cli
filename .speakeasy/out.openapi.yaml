          $ref: '#/components/schemas/IntentRequestPayload'
        diagramID:
          type: string
        time:
          type: number
        metadata:
          type: object
          additionalProperties: {}
      required:
        - type
        - payload
      description: Trigger a specific intent from your conversation model.
    IntentRequestPayload:
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/BaseAction'
        label:
          type: string
        data:
          type: object
          additionalProperties: {}
        query:
          default: ""
          type: string
        intent:
          type: object
          properties:
            name:
              type: string
          required:
            - name
          additionalProperties: {}
        entities:
          default: []
          type: array
          items:
            $ref: '#/components/schemas/IntentRequestEntity'
        confidence:
          type: number
      required:
        - intent
    BaseAction:
      type: object
      properties:
        type:
          type: string
        payload: {}
      required:
        - type
        - payload
    IntentRequestEntity:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        query:
          type: string
        verboseValue:
          type: array
          items:
            $ref: '#/components/schemas/VerboseValue'
      required:
        - name
        - value
    VerboseValue:
      type: object
      properties:
        rawText:
          type: string
        canonicalText:
          type: string
        startIndex:
          type: number
      required:
        - rawText
        - canonicalText
        - startIndex
    ExitTrace:
      type: object
      properties:
        type:
          type: string
          enum:
            - end
          x-enumNames:
            - END
        paths:
          type: array
          items:
            $ref: '#/components/schemas/TracePath'
        defaultPath:
          type: number
        time:
          type: number
        turnID:
          type: string
        handleID:
          type: string
        payload: {}
      required:
        - type
    FlowTrace:
      type: object
      properties:
        type:
          type: string
          enum:
            - flow
          x-enumNames:
            - FLOW
        paths:
          type: array
