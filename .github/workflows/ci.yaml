# Gates every pull request and every push to master.
#
# Until this existed, nothing ran on a PR — not a build, not a test, not vet.
# The only check was Graphite's mergeability check, and it cost the repo twice:
# a master that did not compile from a clean checkout (go.sum was missing
# spyzhov/ajson), and v0.232.0, which failed at release time and left six
# orphaned npm packages behind. Both were introduced by code that had merged
# cleanly days earlier, and both are caught by the jobs below.
#
# What this protects that is specific to this repo: the CLI is generated by
# Speakeasy, and a handful of hand-written files are carried across
# regenerations as persistent edits. A regeneration that silently drops one
# would still compile — nothing would look wrong. The behaviour tests exercise
# every one of those edits, so a dropped edit fails here instead of shipping.

name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Catches an incomplete go.sum, which is what made master uncompilable
      # from a clean checkout. A warm local module cache hides this; CI cannot.
      - name: Verify module integrity
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

  cli:
    name: CLI behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The behaviour tests shell out to ./vf, so the binary has to exist at the
      # repo root under that exact name before vitest starts.
      - name: Build the CLI
        run: go build -o vf ./cmd/vf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Two devDependencies (@voiceflow/oxlint-config, @voiceflow/oxfmt-config)
      # are private, so an unauthenticated install cannot resolve the lockfile
      # even though nothing in the test path uses them.
      - name: Install dependencies
        run: yarn install --immutable
        env:
          # Must be YARN_NPM_*, not NODE_AUTH_TOKEN. Yarn 3 does not read the
          # .npmrc that actions/setup-node writes — the first version of this
          # workflow set NODE_AUTH_TOKEN, and yarn went to its own default
          # registry unauthenticated and 404'd on both private packages.
          YARN_NPM_REGISTRY_SERVER: https://registry.npmjs.org
          YARN_NPM_ALWAYS_AUTH: "true"
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # test/vf-*.test.ts drive the real API and exclude themselves when
      # VF_TOKEN / VF_WORKSPACE_ID are absent (see vitest.config.mts), so this
      # runs the hermetic suite: mock server, --dry-run and --help only.
      - name: Behaviour tests
        run: yarn test

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --immutable
        env:
          # Must be YARN_NPM_*, not NODE_AUTH_TOKEN. Yarn 3 does not read the
          # .npmrc that actions/setup-node writes — the first version of this
          # workflow set NODE_AUTH_TOKEN, and yarn went to its own default
          # registry unauthenticated and 404'd on both private packages.
          YARN_NPM_REGISTRY_SERVER: https://registry.npmjs.org
          YARN_NPM_ALWAYS_AUTH: "true"
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Blocking: verified green on this workflow's own first run (1 warning,
      # 0 errors) before the continue-on-error escape hatch was removed.
      - name: Lint
        run: yarn oxlint

      # No format check here, deliberately. `oxfmt --check` reports 193 of 204
      # files as unformatted: formatting has never run in this repo, and the
      # overwhelming majority of those files are Speakeasy output. Reformatting
      # them would produce a diff that the next regeneration silently undoes,
      # and reformatting only the hand-written files still means touching every
      # test file at once. That is a decision about which paths this repo wants
      # to own, not something to smuggle in behind a CI change — so the gate is
      # left off rather than left permanently red.
